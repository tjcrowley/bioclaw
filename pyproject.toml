[project]
name = "bioclaw"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "scanpy[scrublet]>=1.12",
    "anndata>=0.13",
    "igraph>=0.10.8",
    "claude-agent-sdk>=0.2.152",
    "decoupler>=2.2.0",
    "cellxgene-census>=1.18.0",
    "cell-eval>=0.8.2",
    "gcsfs>=2026.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: requires a live Anthropic API key (ANTHROPIC_API_KEY), excluded from fast/CI runs",
    "bio_fm_smoke: requires a real pretrained scGPT checkpoint in the isolated bio_fm_worker/ environment, excluded from fast/CI runs",
    "vcc_data: requires the downloaded VCC public dataset, excluded from fast/CI runs",
]
